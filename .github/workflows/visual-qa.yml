name: Atrezzo Visual QA — Elegant Massage
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve current main, test Home and retained internal routes
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/elegant-http.log 2>&1 &
          sleep 2
          node tests/codrops-original-motion-qa.cjs
          node tests/home-closing-sections-qa.cjs
          node tests/current-architecture-qa.cjs
          node tests/body-massage-cinematic-qa.cjs
          node tests/unified-glass-nav-qa.cjs
          node tests/treatments-menu-hover-qa.cjs
      - name: Upload screenshots and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elegant-massage-current-main-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 10