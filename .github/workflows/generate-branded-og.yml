name: Elegant Massage — Generate Branded Open Graph PNG
on:
  push:
    branches:
      - feature/internal-pages-ux-seo-location-2026-11-06
    paths:
      - 'scripts/generate-elegant-social-image.py'
      - '.github/workflows/generate-branded-og.yml'
jobs:
  generate-png:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.2.1
      - name: Generate and commit image to review branch
        run: |
          python scripts/generate-elegant-social-image.py
          if [ -n "$(git status --porcelain -- assets/brand/elegant-massage-social-share.png)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/brand/elegant-massage-social-share.png
            git commit -m "assets(og): generated branded social image"
            git push origin HEAD:feature/internal-pages-ux-seo-location-2026-11-06
          else
            echo "Brand image already up to date"
          fi
