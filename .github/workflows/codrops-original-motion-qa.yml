name: Elegant Massage — Original Codrops Motion QA
on:
  push:
    branches: [feature/home-codrops-original-motion]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test source-authentic motion in real browser
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/codrops-http.log 2>&1 &
          sleep 2
          node tests/codrops-original-motion-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elegant-original-codrops-motion-screenshots
          path: qa-artifacts/codrops-motion/
          retention-days: 14
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: zip -qr elegant-codrops-motion-preview.zip index.html assets about contact gallery massage-menu massage-services robots.txt
      - uses: actions/upload-artifact@v4
        with:
          name: elegant-original-motion-functional-preview
          path: elegant-codrops-motion-preview.zip
          retention-days: 14