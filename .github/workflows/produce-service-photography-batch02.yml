name: Atrezzo — Build and publish photo batch 02
on:
  push:
    paths:
      - '.github/workflows/produce-service-photography-batch02.yml'
      - 'scripts/atrezzo_prepare_photo_batch02.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Produce 4 responsive editorial image sets
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'requests>=2.32,<3'
          python scripts/atrezzo_prepare_photo_batch02.py
      - name: Publish candidate photographs with source manifest
        run: |
          git config user.name "atrezzo-studios-photo-bot"
          git config user.email "atrezzo-photo-bot@users.noreply.github.com"
          git add assets/images/*-batch02-*.webp docs/FASE-04-LOTE-02-MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(elegant): produce responsive candidate photos for four massage types"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
