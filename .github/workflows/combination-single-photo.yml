name: Elegant Massage — single cinematic Combination photo
on:
  push:
    paths:
      - 'scripts/atrezzo_combination_single_photo.py'
      - '.github/workflows/combination-single-photo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photograph:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Create two responsive WebPs from one licensed photo
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'requests>=2.32,<3'
          python scripts/atrezzo_combination_single_photo.py
      - name: Verify images and publish in GitHub
        run: |
          git config user.name "atrezzo-studios-photo-bot"
          git config user.email "atrezzo-photo-bot@users.noreply.github.com"
          git add assets/images/elegant-massage-combination-single-*.webp
          git add docs/FASE-04-COMBINATION-SINGLE-IMAGE.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(elegant): replace combination diptych with single cinematic source"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
