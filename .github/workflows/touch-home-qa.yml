name: Elegant Massage — Touch Considered Home QA
on:
  push:
    branches: [feature/home-touch-considered-2026]
  workflow_dispatch:
jobs:
  responsive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test real branch files in browser
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/elegant-touch-http.log 2>&1 &
          sleep 2
          node tests/touch-home-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elegant-touch-home-visuals
          path: qa-artifacts/touch-home/
          retention-days: 14
          if-no-files-found: warn